# Packaging metadata for AnyUse.
#
# AnyUse drives a macOS desktop and web pages on the user's behalf. The core
# (compile, prove, replay) needs only httpx and click; everything
# else is an optional extra below.
#
# Layout note, because it surprises people: the repository root IS the `anyuse`
# package. Working from a clone without installing therefore needs the PARENT of
# the repository on PYTHONPATH:
#     export PYTHONPATH=/path/to/parent-of-anyuse
# `pip install -e .` removes the need for that.

[build-system]
# setuptools >= 77: the SPDX `license` string and `license-files` (PEP 639).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anyuse"
version = "0.4.0"
description = "Record a desktop or web workflow, then compile it to a proved HTTP request and replay that instead of driving the UI."
readme = "README.md"
requires-python = ">=3.11"
# The bundled EasyList/EasyPrivacy extract retains its separate licence choice.
# See THIRD_PARTY_NOTICES.md; dependencies retain their respective terms.
license = "MIT AND (GPL-3.0-or-later OR CC-BY-SA-3.0)"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "licenses/EasyList-GPL-3.0.txt",
    "licenses/EasyList-CC-BY-SA-3.0.txt",
]
authors = [{ name = "AnyUse" }]
keywords = ["automation", "macos", "accessibility", "workflow", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]

# The compile path — compile, prove, replay — needs only these.
# Everything desktop-side (pyobjc, pyautogui, keyring, …) is an EXTRA, so
# a machine that only wants the compiled-workflow half does not install a
# screen-recording stack it will never use.
dependencies = [
    "httpx>=0.27,<1",
    "click>=8.1,<9",
]

[project.optional-dependencies]
# Native REA execution and independent macOS playback observation. Node/REA
# tools and the fixed JavaScript adapter are installed by separate explicit commands.
rea-native = [
    "frida==17.23.3",
    "pyobjc-core>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=12,<13; sys_platform == 'darwin'",
    "Pillow>=10,<13",
    "numpy>=2.0,<3",
]
# Driving and perceiving the local macOS desktop.
desktop = [
    "pyotp>=2.9,<3",
    # credentials/vault.py encrypts the desktop agent's file-backed vault.
    "cryptography>=46,<51",
    "pyautogui>=0.9.54,<1",
    "pynput>=1.7,<2",
    "pyobjc-core>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=12,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "keyring>=24; sys_platform == 'darwin'",
    "pyobjc-framework-Security>=10; sys_platform == 'darwin'",
    "pyobjc-framework-LocalAuthentication>=10; sys_platform == 'darwin'",
    "Pillow>=10,<13",
    "numpy>=2.0,<3",
]
# Exposing compiled workflows to an external agent.
mcp = [
    "mcp>=1.0,<2",
    # Encrypted inbox values and Chrome cookie decryption.
    "cryptography>=46,<51",
    # The meta profile validates call_operation arguments with it and refuses
    # to run without it (mcpserver/meta_tools.py). mcp itself also pulls it in.
    "jsonschema>=4.20,<5",
]
# Signing and key generation for the opt-in map registry client.
registry = [
    "cryptography>=46,<51",
]
# Talking to a Chromium over its DevTools socket: anyuse attach, anyuse learn, browser replay.
cdp = [
    "websockets>=12,<16",
]
# Optional small local decision model (Laya by Convai Innovations, Apache-2.0) for host-side or OpenJev use;
# for the offline container wheelhouse + weights, run `python tools/confirmer/fetch_laya.py`.
laya = [
    "laya>=0.3.20,<1",
]
# Running the test suite (tools/guarded_tests/run_allowed.sh).
test = [
    "pytest>=8",
    "setuptools>=77",
    "wheel",
    "websockets>=12,<16",
    "numpy>=2.0,<3",
    "Pillow>=10,<13",
    "mcp>=1.0,<2",
    "jsonschema>=4.20,<5",
    "cryptography>=46,<51",
]

[project.scripts]
anyuse = "anyuse.cli:main"

[project.urls]
Homepage = "https://github.com/michaelAGI/anyuse"
Repository = "https://github.com/michaelAGI/anyuse"
Issues = "https://github.com/michaelAGI/anyuse/issues"

[tool.setuptools]
# The repository root is the package: `anyuse` maps to ".", and every
# subpackage inherits that mapping. The packages are LISTED, not found:
# `packages.find` under a root-mapped package emits the subpackages without
# the `anyuse.` prefix and drops the root modules, which produced a wheel
# that installed and could not be imported.
package-dir = { "anyuse" = "." }
packages = [
    "anyuse",
    "anyuse.context",
    "anyuse.core",
    "anyuse.credentials",
    "anyuse.execution",
    "anyuse.execution.web_scope_data",
    "anyuse.execution.web_runtime",
    "anyuse.execution.guest",
    "anyuse.execution.guest.blender",
    "anyuse.guides",
    "anyuse.mcpserver",
    "anyuse.memory",
    "anyuse.osplatform",
    "anyuse.registry",
    # Data-only directories, listed so setuptools ships them without the
    # "absent from the packages configuration" warning (they hold no code).
    "anyuse.docs",
    "anyuse.registry.seed",
    "anyuse.registry.worker",
    "anyuse.registry.worker.src",
    "anyuse.testdata",
    "anyuse.testdata.discovery",
    "anyuse.tools",
    "anyuse.tools.confirmer",
    "anyuse.watcher",
]

[tool.setuptools.cmdclass]
# Test files never ship in the wheel (_wheel_build.py); tests/test_wheel_contents.py builds one and checks.
build_py = "anyuse._wheel_build.BuildPy"

[tool.setuptools.package-data]
anyuse = ["requirements.txt", "LICENSE", "THIRD_PARTY_NOTICES.md"]
"anyuse.docs" = ["*.md", "*.txt"]
"anyuse.registry" = ["*.json"]
# web_scope_data/*.dat and *.sha256: an optional pinned Public Suffix List and its digest (execution/web_scope.py)
"anyuse.execution" = ["*.json", "*.js", "web_scope_data/*.gz", "web_scope_data/*.json", "web_scope_data/*.dat",
                      "web_scope_data/*.sha256"]
"anyuse.execution.web_runtime" = ["*.txt"]
"anyuse.guides" = ["*.json"]
"anyuse.registry.seed" = ["*.json"]
"anyuse.registry.worker" = ["*.sql", "*.mjs", "*.sh", "*.toml"]
"anyuse.registry.worker.src" = ["*.js"]
"anyuse.testdata.discovery" = ["*.json", "*.json.gz"]
